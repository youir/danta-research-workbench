<text x="89" y="731" fill="#1c2d43" font-size="23" font-weight="700">日常使用路径</text>
<g fill="#ebe7fa"><rect x="89" y="759" width="212" height="54" rx="12"/><rect x="338" y="759" width="212" height="54" rx="12"/><rect x="587" y="759" width="212" height="54" rx="12"/><rect x="836" y="759" width="212" height="54" rx="12"/><rect x="1085" y="759" width="266" height="54" rx="12"/></g>
<g fill="#473880" font-size="19" font-weight="650" text-anchor="middle"><text x="195" y="793">写问题 / 继续任务</text><text x="444" y="793">交接 Codex 工作</text><text x="693" y="793">回任务预览成果</text><text x="942" y="793">反馈修改，保留新版</text><text x="1218" y="793">记录下一步，重开继续</text></g>
<g stroke="#877cbf" stroke-width="2" marker-end="url(#arrow)"><path d="M307 786H330"/><path d="M556 786H579"/><path d="M805 786H828"/><path d="M1054 786H1077"/></g>
<text x="89" y="859" fill="#647084" font-size="17">实质步骤：输入索引 → 过程记录 → 产出索引 → 核查与交接。普通问题可直接在 Codex 中讨论。</text>
<text x="89" y="890" fill="#647084" font-size="17">启动语需粘贴提交；分析依赖按任务核对；已有有效授权沿用。所有能力以实际本机连接与运行情况为准。</text>
<text x="64" y="952" fill="#8b8499" font-size="15">2026-10-05 · 源码体系说明；本轮新增生信引导与来源展示尚待发布安装包。</text></g></svg>