<text x="64" y="129" fill="#1c2d43" font-size="36" font-weight="700">一个问题，持续接着做</text>
<text x="64" y="168" fill="#647084" font-size="19">工作台管理入口，Codex 完成工作，GY 留下研究记录，成果目录保留版本。</text>
