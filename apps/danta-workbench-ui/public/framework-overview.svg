<text x="87" y="450"><tspan x="87" dy="0">今天 · 研究任务</tspan><tspan x="87" dy="35">文献资料 · 汇报制图</tspan><tspan x="87" dy="35">设置 · 草稿与恢复</tspan><tspan x="87" dy="35">成果预览 · 修改意见</tspan></text>
<text x="427" y="450"><tspan x="427" dy="0">理解目标 · 恢复上下文</tspan><tspan x="427" dy="35">检索 · 分析 · 写作 · 制图</tspan><tspan x="427" dy="35">按需专项角色与工具</tspan><tspan x="427" dy="35">使用真实材料与运行记录</tspan></text>
<text x="767" y="450"><tspan x="767" dy="0">研究画像 · 协作偏好</tspan><tspan x="767" dy="35">课题状态 · 思路 · 证据</tspan><tspan x="767" dy="35">决定 · 实际步骤与交接</tspan><tspan x="767" dy="35">一套权威记录，索引相连</tspan></text>
