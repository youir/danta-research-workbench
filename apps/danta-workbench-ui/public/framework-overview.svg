<title id="title">龚博士科研工作台整体体系</title><desc id="desc">工作台、Codex、私有知识库和成果目录协同：提出问题、推进实际步骤、查看成果、反馈修改和恢复下一步。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#877cbf"/></marker></defs>
