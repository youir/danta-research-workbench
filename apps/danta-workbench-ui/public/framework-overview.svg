</g>
<g fill="#8b8499" font-size="15"><text x="87" y="617">连接一次，核对后恢复有效范围</text><text x="427" y="617">角色配置不等于工具已经运行</text><text x="767" y="617">私有资料不随公开 Git 上传</text><text x="1107" y="617">运行成功不等于科学验证</text></g>
