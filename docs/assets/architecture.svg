<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">龚博士科研工作台完整架构</title>
  <desc id="desc">可安装的桌面工作台、本机桥接服务、Codex 职责协作与私有 Obsidian 知识库之间的数据和授权关系。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F0FA"/><stop offset="1" stop-color="#E9F5F1"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#24364B" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B7F96"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16827C"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6D61B2"/></marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #20344C; }
      .title { font-size: 39px; font-weight: 700; } .subtitle { font-size: 20px; fill: #5E7188; }
      .section { font-size: 22px; font-weight: 700; } .cardTitle { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; fill: #40566F; } .small { font-size: 15px; fill: #62748A; }
      .tag { font-size: 14px; font-weight: 600; } .agentTitle { font-size: 17px; font-weight: 700; }
      .agentBody { font-size: 14px; fill: #566A80; }
    </style>
  </defs>
  <rect width="1600" height="1280" fill="#F5F7FA"/><rect width="1600" height="138" fill="url(#header)"/>
  <text x="60" y="61" class="title">龚博士科研工作台｜完整架构</text>
  <text x="60" y="101" class="subtitle">桌面图标打开工作台 → Codex 接续执行 → 成果与来源记录 → Obsidian 持续留存</text>
  <rect x="1190" y="38" width="350" height="46" rx="23" fill="#FFFFFF" stroke="#CCD9E5"/><circle cx="1216" cy="61" r="7" fill="#16827C"/>
  <text x="1233" y="67" class="small">数据留在本机 · 权限分层授权</text>

  <text x="60" y="178" class="section">01　从桌面应用进入任务，并调用本地能力</text>
  <g filter="url(#shadow)">
    <rect x="60" y="200" width="230" height="196" rx="18" fill="#FFFFFF" stroke="#C9D6E4"/>
    <rect x="340" y="200" width="570" height="196" rx="18" fill="#EDF4FF" stroke="#B9D0ED"/>
    <rect x="960" y="200" width="580" height="196" rx="18" fill="#EAF6F2" stroke="#B9DCD2"/>
  </g>
  <text x="84" y="239" class="small">使用者</text><text x="84" y="277" class="cardTitle">龚博士</text>
  <text x="84" y="312" class="body">选择任务与工作区</text><text x="84" y="342" class="body">确认内容与授权范围</text>
  <text x="84" y="372" class="small">科学判断由本人和导师决定</text>
  <text x="365" y="239" class="small">独立窗口中的 React 工作台</text><text x="365" y="277" class="cardTitle">任务卡与研究工作区</text>
  <text x="365" y="312" class="body">选题 · 论文 · PPT / 组会 · 日报 · 机制图</text>
  <text x="365" y="342" class="body">目标、阶段、下一步 · 成果、来源与版本</text>
  <text x="365" y="372" class="small">多任务恢复；阶段记录可保存到 Obsidian</text>
  <text x="985" y="239" class="small">随桌面程序启动 · 127.0.0.1:48921</text><text x="985" y="277" class="cardTitle">本地桥接层（Local Bridge）</text>
  <text x="985" y="312" class="body">Obsidian：选择目录后逐项授权；范围只驻留服务内存</text>
  <text x="985" y="342" class="body">Codex：创建新对话，或打开任务关联对话</text>
  <text x="985" y="372" class="small">归档另行授权，只能在指定目录新建文件</text>
  <path d="M292 297H330" fill="none" stroke="#6B7F96" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M912 297H950" fill="none" stroke="#16827C" stroke-width="3" marker-end="url(#arrowTeal)"/>


  <text x="60" y="444" class="section">02　工作台交接到 Codex，主 agent 按职责组织协作</text>
  <g filter="url(#shadow)">
    <rect x="60" y="466" width="1480" height="446" rx="20" fill="#FFFFFF" stroke="#D5DDE7"/>
    <rect x="86" y="520" width="350" height="354" rx="17" fill="#EEF2FF" stroke="#C9CEF1"/>
    <rect x="462" y="520" width="1052" height="248" rx="17" fill="#FAFBFD" stroke="#D9E1E9"/>
    <rect x="462" y="787" width="1052" height="87" rx="16" fill="#F3F5F8" stroke="#D9E1E9"/>
  </g>
  <text x="88" y="499" class="small">Codex 桌面端 · 目标工作区中的新对话</text>
  <text x="109" y="559" class="cardTitle">主引导 / 主 agent</text>
  <text x="109" y="596" class="body">恢复本轮相关上下文</text><text x="109" y="626" class="body">判断目标、权限和停止条件</text>
  <text x="109" y="656" class="body">简单任务直接完成</text><text x="109" y="686" class="body">复杂任务明确负责人并协调</text>
  <line x1="109" y1="710" x2="407" y2="710" stroke="#D2D8EB"/>
  <text x="109" y="742" class="small">核对依据、未知、交付与下一步</text><text x="109" y="774" class="small">长期记录保留来源与证据状态</text>
  <rect x="108" y="807" width="304" height="43" rx="11" fill="#FFFFFF" stroke="#D5DCEE"/>
  <text x="127" y="834" class="tag">启动语复制后需手动粘贴并提交</text>
  <path d="M438 697H454" fill="none" stroke="#6D61B2" stroke-width="3" marker-end="url(#arrowViolet)"/>

  <text x="486" y="550" class="small">职责 agent · 独立任务才并行，主交付由一位负责人牵头</text>
  <g>
    <rect x="486" y="570" width="244" height="80" rx="12" fill="#EDF4FF" stroke="#C8D8EC"/>
    <rect x="742" y="570" width="244" height="80" rx="12" fill="#EAF6F2" stroke="#C7E0D8"/>
    <rect x="998" y="570" width="214" height="80" rx="12" fill="#FFF5E9" stroke="#ECD9BB"/>
    <rect x="1224" y="570" width="266" height="80" rx="12" fill="#F3EEFC" stroke="#D7CDEC"/>
    <rect x="610" y="664" width="244" height="80" rx="12" fill="#EAF6F2" stroke="#C7E0D8"/>
    <rect x="866" y="664" width="244" height="80" rx="12" fill="#F3F5F8" stroke="#D9E1E9"/>
    <rect x="1122" y="664" width="244" height="80" rx="12" fill="#FCEFED" stroke="#E8D0CB"/>
  </g>
  <text x="504" y="597" class="agentTitle">文献与证据</text><text x="504" y="625" class="agentBody">检索、精读、证据核查</text>
  <text x="760" y="597" class="agentTitle">方法与统计</text><text x="760" y="625" class="agentBody">设计、终点、分析假设</text>
  <text x="1016" y="597" class="agentTitle">生信与数据库</text><text x="1016" y="625" class="agentBody">数据映射与获授权分析</text>
  <text x="1242" y="597" class="agentTitle">论文写作</text><text x="1242" y="625" class="agentBody">起草、修订、投稿材料</text>
  <text x="628" y="691" class="agentTitle">组会与科研表达</text><text x="628" y="719" class="agentBody">汇报、科研图与会后复盘</text>
  <text x="884" y="691" class="agentTitle">知识库整理</text><text x="884" y="719" class="agentBody">索引、归档建议、长期状态</text>
  <text x="1140" y="691" class="agentTitle">质疑与质量审查</text><text x="1140" y="719" class="agentBody">反例、证据缺口与风险</text>
  <text x="486" y="818" class="small">方法与外部能力</text>
  <rect x="623" y="800" width="237" height="54" rx="12" fill="#FFFFFF" stroke="#D8E0E9"/>
  <rect x="875" y="800" width="317" height="54" rx="12" fill="#FFFFFF" stroke="#D8E0E9"/>
  <rect x="1207" y="800" width="283" height="54" rx="12" fill="#FFFFFF" stroke="#D8E0E9"/>
  <text x="644" y="833" class="tag">Skills：任务方法</text>
  <text x="894" y="833" class="tag">公开检索：Consensus · Semantic Scholar</text>
  <text x="1227" y="833" class="tag">Jev · PubMed Linked Discoveries</text>
  <path d="M1250 397V452" fill="none" stroke="#6D61B2" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <rect x="1087" y="414" width="358" height="30" rx="15" fill="#F4F0FC"/>
  <text x="1266" y="434" text-anchor="middle" class="tag" fill="#6255A8">创建新对话 · 打开 · 启动语入剪贴板</text>

  <text x="60" y="958" class="section">03　唯一私有知识库：接续任务与研究材料</text>
  <g filter="url(#shadow)"><rect x="60" y="981" width="1480" height="214" rx="20" fill="#EAF6F2" stroke="#B9DCD2"/></g>
  <text x="90" y="1025" class="cardTitle">Obsidian vault · 研究资料的唯一长期档案</text>
  <text x="90" y="1062" class="body">课题与研究日志　·　文献证据　·　RSS 插件已有缓存　·　阶段快照与新归档</text>
  <text x="90" y="1097" class="body">工作台按模块授权后读取指定目录；新归档只在约定目录创建文件，不覆盖旧记录。</text>
  <text x="90" y="1132" class="body">Codex 访问文件另受 Codex 本机运行权限与本轮任务授权约束，与工作台读取范围相互独立。</text>
  <text x="90" y="1170" class="small">点击保存阶段记录后新增快照；保留来源与未决问题，不自动改变任务状态。</text>
  <path d="M1510 390H1570V1088H1552" fill="none" stroke="#16827C" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="1552" y="715" text-anchor="middle" transform="rotate(90 1552 715)" class="tag" fill="#16827C">工作台 scope：逐项授权</text>
  <path d="M1050 912V972" fill="none" stroke="#6D61B2" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <text x="1070" y="950" class="tag" fill="#6255A8">Codex 本机权限</text>
  <text x="60" y="1243" class="small">桌面工作台权限只约束本地桥接层；Codex 文件权限由本机运行环境管理。新对话由本人粘贴、核对并提交。</text>
</svg>
