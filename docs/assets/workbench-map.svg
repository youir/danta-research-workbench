<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">一张图看懂科研工作台</title>
  <desc id="desc">通过 Windows 桌面图标打开工作台、创建 Codex 新对话、按范围连接 Obsidian，并恢复尚未完成的草稿。</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF1FA"/><stop offset="1" stop-color="#EEF7F3"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8191A5"/></marker>
    <style>
      text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#28364D}
      .title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#66778D}
      .head{font-size:27px;font-weight:700}.body{font-size:22px;fill:#536077}
      .n{font-size:24px;fill:#6D61B2;font-weight:700}.tag{font-size:16px;font-weight:600;fill:#5C7088}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#F8F9FB"/><rect width="1600" height="155" fill="url(#wash)"/>
  <text x="70" y="82" class="title">一张图看懂科研工作台</text>
  <text x="70" y="127" class="sub">双击桌面图标 → Codex 新对话执行 → 核对结果 → Obsidian 留存</text>
  <rect x="1230" y="50" width="300" height="48" rx="24" fill="#FFFFFF" stroke="#D9E2EA"/>
  <circle cx="1258" cy="74" r="7" fill="#16827C"/><text x="1278" y="81" class="tag">本机运行 · 按范围授权</text>

  <g fill="#FFFFFF" stroke="#DDE4EC" stroke-width="1.5">
    <rect x="70" y="190" width="710" height="255" rx="20"/>
    <rect x="820" y="190" width="710" height="255" rx="20"/>
    <rect x="70" y="470" width="710" height="255" rx="20"/>
    <rect x="820" y="470" width="710" height="255" rx="20"/>
    <rect x="70" y="750" width="710" height="255" rx="20"/>
    <rect x="820" y="750" width="710" height="255" rx="20"/>
  </g>
  <text x="98" y="234" class="n">01</text><text x="152" y="234" class="head">先说这次要推进什么</text>
  <text x="100" y="284" class="body">开始页：选题、论文、PPT、组会或科研日报。</text>
  <text x="100" y="322" class="body">研究记录、文献、归档、机制图在主导航。</text>
  <text x="100" y="360" class="body">首页能继续上次留下的任务草稿。</text>
  <text x="100" y="398" class="body">过程说明用于引导，不代表后台正在执行。</text>

  <text x="848" y="234" class="n">02</text><text x="902" y="234" class="head">把汇报任务补充清楚</text>
  <text x="850" y="284" class="body">按本次工作填写主题、材料、听众和讨论点。</text>
  <text x="850" y="322" class="body">PPT 可选择汇报结构、视觉模板和单位标识。</text>
  <text x="850" y="360" class="body">提示词框架只整理已提供的真实研究内容。</text>
  <text x="850" y="398" class="body">未知信息可保留待确认，不补造结果。</text>

  <text x="98" y="514" class="n">03</text><text x="152" y="514" class="head">交接到选定的 Codex 工作区</text>
  <text x="100" y="564" class="body">工作台读取本机 Codex 项目列表。</text>
  <text x="100" y="602" class="body">选择项目后创建新对话，并尝试打开。</text>
  <text x="100" y="640" class="body">启动语复制到剪贴板，输入框需手动粘贴。</text>
  <text x="100" y="678" class="body">检查内容后由使用者提交；工作台不代发。</text>

  <text x="848" y="514" class="n">04</text><text x="902" y="514" class="head">由主 agent 接续执行</text>
  <text x="850" y="564" class="body">主 agent 恢复授权上下文、拆解目标与边界。</text>
  <text x="850" y="602" class="body">按任务调用文献、方法、生信、写作等角色。</text>
  <text x="850" y="640" class="body">Skills 提供方法；外部工具按需处理公开查询。</text>
  <text x="850" y="678" class="body">工作台不会读取 Codex 历史对话。</text>

  <text x="98" y="794" class="n">05</text><text x="152" y="794" class="head">只连接需要的知识库范围</text>
  <text x="100" y="844" class="body">选择 Obsidian 文件夹，再逐项授予页面权限。</text>
  <text x="100" y="882" class="body">工作台按授权读取记录、文献或 RSS 已有缓存。</text>
  <text x="100" y="920" class="body">查看归档和新建归档分别控制。</text>
  <text x="100" y="958" class="body">新归档只新建文件，不覆盖或删除旧记录。</text>

  <text x="848" y="794" class="n">06</text><text x="902" y="794" class="head">核对成果，保存可继续的状态</text>
  <text x="850" y="844" class="body">研究结论由龚博士与导师决定。</text>
  <text x="850" y="882" class="body">重要状态核对后，由主 agent 协调写入 vault。</text>
  <text x="850" y="920" class="body">关闭重开工作台后，草稿仍可恢复。</text>
  <text x="850" y="958" class="body">退出后需重新选择知识库并授权。</text>

  <text x="70" y="1082" class="sub">桌面应用授权限制本机桥接服务；Codex 文件访问受另一套本机运行权限与任务授权管理。</text>
  <text x="70" y="1136" class="sub">龚博士科研工作台　·　思维优先，决定在人　·　2026.09</text>
</svg>
