<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#FAF9F6"/><style>text{font-family:PingFang SC,Hiragino Sans GB,sans-serif;fill:#28364D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#748096}.head{font-size:27px;font-weight:600}.body{font-size:23px;fill:#536077}.n{font-size:24px;fill:#7864C8;font-weight:600}</style><text x="70" y="85" class="title">一张图看懂科研工作台</text><text x="70" y="130" class="sub">界面入口 → Codex 执行 → 技能与工具 → 研究产物 → 私有知识库</text><rect x="70" y="175" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="96" y="219" class="n">01</text><text x="150" y="219" class="head">本机网页 · 选择工作入口</text><text x="98" y="267" class="body">开始：选题、论文、PPT、组会、日报。</text><text x="98" y="304" class="body">主导航：研究记录、机制图、文献、知识库。</text><text x="98" y="341" class="body">机制图既可独立进入，也可从 PPT 进入。</text><text x="98" y="378" class="body">未接入的资料与对话会显示真实空状态。</text><rect x="820" y="175" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="846" y="219" class="n">02</text><text x="900" y="219" class="head">任务交接 · 简短需求变成启动语</text><text x="848" y="267" class="body">独立工作区保留当前草稿和文件名。</text><text x="848" y="304" class="body">网页补齐对应工作方法，整理启动语。</text><text x="848" y="341" class="body">龚博士确认后复制到 Codex 对话。</text><text x="848" y="378" class="body">检查更新后，由 Codex 在本机执行。</text><rect x="70" y="460" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="96" y="504" class="n">03</text><text x="150" y="504" class="head">Codex 主助理 · 理解与协调</text><text x="98" y="552" class="body">理解本轮目标及明确授权的研究资料。</text><text x="98" y="589" class="body">简单任务直接做，复杂任务按职责分派。</text><text x="98" y="626" class="body">文献、方法、生信、写作、科研表达、</text><text x="98" y="663" class="body">知识整理、质疑复核：按需协作。</text><rect x="820" y="460" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="846" y="504" class="n">04</text><text x="900" y="504" class="head">机制图 · 方法与绘图资源</text><text x="848" y="552" class="body">主工作流：danta-research-ppt + PPT Master。</text><text x="848" y="589" class="body">证据关系表 → 逻辑草图 → 人工确认 → 制图。</text><text x="848" y="626" class="body">BioTender 技能库作为可选参考。</text><text x="848" y="663" class="body">BioRender 作为外部绘图入口。</text><rect x="70" y="745" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="96" y="789" class="n">05</text><text x="150" y="789" class="head">交付 · 可编辑且可追溯</text><text x="98" y="837" class="body">论文草案、组会纪要、日报与行动项。</text><text x="98" y="874" class="body">可编辑 PPT、SVG 图稿、来源与检查记录。</text><text x="98" y="911" class="body">区分事实、推断、假说和待核实关系。</text><text x="98" y="948" class="body">龚博士与导师决定取舍和最终版本。</text><rect x="820" y="745" width="710" height="255" rx="20" fill="white" stroke="#E4E0EF"/><text x="846" y="789" class="n">06</text><text x="900" y="789" class="head">长期记忆 · 唯一私有 GY 知识库</text><text x="848" y="837" class="body">由 Codex 在授权路径内归档与更新索引。</text><text x="848" y="874" class="body">保留证据、思路、决定、反馈和成果版本。</text><text x="848" y="911" class="body">Obsidian 用于浏览和长期积累。</text><text x="848" y="948" class="body">网页对话、GY 和文件同步仍属于待接入能力。</text><text x="70" y="1100" class="sub">实线工作链路：网页整理启动语 → 人工复制到 Codex → 使用技能执行；外部网站仅提供跳转。</text><text x="70" y="1150" class="sub">龚博士科研工作台  ·  思维优先，决定在人  ·  2026.09</text></svg>