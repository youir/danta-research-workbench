<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f0ff"/><stop offset="1" stop-color="#effaf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#22324d" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #20324d; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #526681; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; fill: #526681; }
      .cardtitle { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; fill: #405674; }
      .small { font-size: 15px; fill: #526681; }
    </style>
  </defs>
  <rect width="1600" height="1160" fill="#f6f8fc"/>
  <rect width="1600" height="125" fill="url(#head)"/>
  <text x="60" y="60" class="title">龚博士科研工作台</text>
  <text x="60" y="98" class="subtitle">一个对话入口 · 七类职责 agent · 一份私有研究档案</text>
  <text x="1360" y="65" class="label">思维优先 · 决定在人</text>

  <text x="60" y="165" class="section">01　龚博士只需说想推进什么</text>
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="280" height="125" rx="18" fill="#fff" stroke="#cad7e8"/>
    <rect x="365" y="190" width="280" height="125" rx="18" fill="#e9f3ff" stroke="#b8d2f1"/>
    <rect x="670" y="190" width="280" height="125" rx="18" fill="#eaf7f3" stroke="#b8dfd3"/>
    <rect x="975" y="190" width="280" height="125" rx="18" fill="#fff5e9" stroke="#efd3ae"/>
    <rect x="1280" y="190" width="260" height="125" rx="18" fill="#f2edff" stroke="#d5c9f5"/>
  </g>
  <text x="82" y="225" class="label">龚博士</text><text x="82" y="260" class="cardtitle">自然表达需求</text><text x="82" y="292" class="body">不必选 agent 或技能</text>
  <text x="387" y="225" class="label">主 agent</text><text x="387" y="260" class="cardtitle">恢复相关上下文</text><text x="387" y="292" class="body">理解目标与当前边界</text>
  <text x="692" y="225" class="label">按职责路由</text><text x="692" y="260" class="cardtitle">指定工作负责人</text><text x="692" y="292" class="body">简单任务主 agent 直接做</text>
  <text x="997" y="225" class="label">核对交付</text><text x="997" y="260" class="cardtitle">依据、未知、产物</text><text x="997" y="292" class="body">说明限制与下一步</text>
  <text x="1302" y="225" class="label">持续接续</text><text x="1302" y="260" class="cardtitle">重要变化入库</text><text x="1302" y="292" class="body">下次仍从这里继续</text>
  <path d="M342 252h16m287 0h16m287 0h16m287 0h16" stroke="#7187a4" stroke-width="3"/>

  <text x="60" y="365" class="section">02　七类 agent 分工，一项主要工作一个负责人</text>
  <g filter="url(#shadow)">
    <rect x="60" y="392" width="350" height="180" rx="18" fill="#fff" stroke="#9cbbe3"/>
    <rect x="430" y="392" width="350" height="180" rx="18" fill="#fff" stroke="#9bd2c3"/>
    <rect x="800" y="392" width="350" height="180" rx="18" fill="#fff" stroke="#efc88f"/>
    <rect x="1170" y="392" width="370" height="180" rx="18" fill="#fff" stroke="#c7b8ed"/>
    <rect x="60" y="592" width="350" height="180" rx="18" fill="#fff" stroke="#9cbbe3"/>
    <rect x="430" y="592" width="350" height="180" rx="18" fill="#fff" stroke="#9bd2c3"/>
    <rect x="800" y="592" width="350" height="180" rx="18" fill="#fff" stroke="#e5a6a0"/>
    <rect x="1170" y="592" width="370" height="180" rx="18" fill="#f1f4f8" stroke="#d2dbe7"/>
  </g>
  <text x="84" y="430" class="label">danta_evidence</text><text x="84" y="465" class="cardtitle">文献与证据</text><text x="84" y="500" class="body">检索 · 精读 · 证据核查</text><text x="84" y="530" class="body">研究空白 · 日报线索复核</text>
  <text x="454" y="430" class="label">danta_methods</text><text x="454" y="465" class="cardtitle">方法与统计</text><text x="454" y="500" class="body">研究设计 · 终点 · 统计假设</text><text x="454" y="530" class="body">可行性 · 替代解释</text>
  <text x="824" y="430" class="label">danta_bioinformatics</text><text x="824" y="465" class="cardtitle">生信与数据库</text><text x="824" y="500" class="body">数据库映射 · 分析方案</text><text x="824" y="530" class="body">获授权的执行与运行记录</text>
  <text x="1194" y="430" class="label">danta_writing</text><text x="1194" y="465" class="cardtitle">论文写作</text><text x="1194" y="500" class="body">起草 · 修订 · 翻译</text><text x="1194" y="530" class="body">审稿回复 · 投稿材料</text>
  <text x="84" y="630" class="label">danta_communication</text><text x="84" y="665" class="cardtitle">组会与科研表达</text><text x="84" y="700" class="body">会前准备 · 会后复盘</text><text x="84" y="730" class="body">PPT · 机制图 · 科研图</text>
  <text x="454" y="630" class="label">danta_knowledge</text><text x="454" y="665" class="cardtitle">知识库整理</text><text x="454" y="700" class="body">权威路径 · 索引 · 归档建议</text><text x="454" y="730" class="body">只读草稿，主 agent 审核写入</text>
  <text x="824" y="630" class="label">danta_critic</text><text x="824" y="665" class="cardtitle">质疑与质量审查</text><text x="824" y="700" class="body">论证 · 设计 · 稿件 · 汇报</text><text x="824" y="730" class="body">反例、缺口与改进方向</text>
  <text x="1194" y="630" class="label">按任务选择最小组合</text><text x="1194" y="665" class="cardtitle">最多 3 个并行</text><text x="1194" y="700" class="body">独立问题可并行</text><text x="1194" y="730" class="body">有依赖的步骤顺序完成</text>

  <text x="60" y="827" class="section">03　主 agent 核对并接续到同一份私有研究档案</text>
  <g filter="url(#shadow)">
    <rect x="60" y="854" width="720" height="205" rx="20" fill="#fff" stroke="#b8cce7"/>
    <rect x="800" y="854" width="740" height="205" rx="20" fill="#f2effb" stroke="#d2c7ec"/>
  </g>
  <text x="90" y="895" class="cardtitle">唯一 Obsidian vault：证据、思路、决定、组会与产物</text>
  <text x="90" y="934" class="body">主 agent 汇总来源、阅读范围、结果状态、分歧与待核实项。</text>
  <text x="90" y="968" class="body">共享画像、当前状态和决策日志由主 agent 核对后统一更新。</text>
  <text x="90" y="1016" class="small">临时讨论不自动成为长期记忆；不同 agent 的一致意见不等于新增证据。</text>
  <text x="830" y="895" class="cardtitle">龚博士与导师保留研究决定权</text>
  <text x="830" y="934" class="body">AI 提供证据、方法选项、写作草案与可执行下一步。</text>
  <text x="830" y="968" class="body">授权范围、资料外发和分析执行按本轮任务明确核对。</text>
  <text x="830" y="1016" class="small">Skills 是工作方法；职责 agent 不是独立的科学权威。</text>
  <text x="60" y="1110" class="label">一条主线：说出需要 → 主 agent 指定负责人 → 核对交付 → 更新唯一档案 → 下次接续</text>
</svg>
